<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SpriteMind — Local AI Pixel Art Generator & Research Platform</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%238b5cf6'><rect x='2' y='2' width='8' height='8'/><rect x='14' y='2' width='8' height='8'/><rect x='2' y='14' width='8' height='8'/><rect x='14' y='14' width='8' height='8'/></svg>" />
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- React 18, ReactDOM, and Lucide Icons -->
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            dark: {
              950: '#090a0f',
              900: '#0f111a',
              850: '#151824',
              800: '#1b1f2e',
              750: '#22273b',
              700: '#2a3149',
              600: '#384263',
              500: '#52608d',
            }
          },
          fontFamily: {
            sans: ['Inter', 'sans-serif'],
            mono: ['Fira Code', 'monospace'],
          }
        }
      }
    }
  </script>
  <style>
    body { background-color: #090a0f; color: #f1f5f9; font-family: 'Inter', sans-serif; overflow: hidden; }
    .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scrollbar::-webkit-scrollbar-track { background: #0f111a; }
    .custom-scrollbar::-webkit-scrollbar-thumb { background: #2a3149; border-radius: 3px; }
    .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #384263; }
    .checker-bg {
      background-image:
        linear-gradient(45deg, #151824 25%, transparent 25%),
        linear-gradient(-45deg, #151824 25%, transparent 25%),
        linear-gradient(45deg, transparent 75%, #151824 75%),
        linear-gradient(-45deg, transparent 75%, #151824 75%);
      background-size: 16px 16px;
      background-position: 0 0, 0 8px, 8px -8px, -8px 0px;
    }
    .pixelated { image-rendering: pixelated; }
  </style>
</head>
<body class="bg-dark-950 text-slate-100 h-screen w-screen flex flex-col select-none">
  <div id="root" class="h-full w-full flex flex-col"></div>

  <script src="/app.js"></script>
</body>
</html>
