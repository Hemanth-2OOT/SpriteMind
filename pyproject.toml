[project]
name = "spritemind"
version = "0.1.0"
description = "Local neural pixel-sprite generator driven by a drawing-action DSL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q --cov=spritemind --cov-report=term-missing:skip-covered"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.coverage.run]
source = ["backend/spritemind"]
branch = true

[tool.coverage.report]
# Measured 71.9% (statement+branch) when this gate was added; the floor sits just
# below it so a small refactor does not block, but a real regression does.
fail_under = 71
skip_covered = true
show_missing = true

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", "data", "docs"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F401", "F841"]
