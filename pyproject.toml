[project]
name = "spritemind"
version = "0.1.0"
description = "Local neural pixel-sprite generator driven by a drawing-action DSL"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["frontend", "data", "docs"]

[tool.ruff.lint]
select = ["E9", "F"]
ignore = ["F401"]

[tool.ruff.lint.per-file-ignores]
"backend/tests/*" = ["F401", "F841"]
